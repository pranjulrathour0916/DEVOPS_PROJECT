name: Deploy My Mart

on:
 push:
  branches: ["main"]

permissions:
 pages: write
 id-token: write

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout Code
     uses: actions/checkout@v4
     
   - name: docker login
     run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
   - name: Build My_Mart Docker Images
     run: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend -f ./My-Mart/dockerfile ./My-Mart

   - name: Build My_Mart_DB Docker Image
     run: docker build -t ${{ secrets.DOCKER_USERNAME }}/backend -f ./martdb/dockerfile ./martdb
  
   - name: Pushing Image to docker hub
     run: |
           docker push ${{ secrets.DOCKER_USERNAME }}/frontend
           docker push ${{ secrets.DOCKER_USERNAME }}/backend

   - name: Create k8s Kind Cluster
     uses: helm/kind-action@v1.10.0

   - name: Deploying Frontend on K8s
     run: helm upgrade --install frontend ./frontend --namespace app --create-namespace
     working-directory: ./k8s

   - name: Deploying Backend on K8s
     run: helm upgrade --install backend ./backend -n app
     working-directory: ./k8s
    
   - name: Veryfing Frontend container
     run: kubectl rollout status deployment/frontend -n app

   - name: Veryfing backend container
     run: kubectl rollout status deployment/backend -n app

 success-message: 
    needs: [build]
    runs-on: ubuntu-latest
    if: success()
    steps:
    - run: echo "All jobs passed"
    